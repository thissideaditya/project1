<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post Editor — ADA Law Chamber Admin</title>
<link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar">
    <a href="../index.html" class="brand">
      <img src="../assets/images/logo.svg" alt="ADA Law Chamber crest">
      <span class="brand-text"><strong>ADA Law Chamber</strong><span>Admin Panel</span></span>
    </a>
    <nav class="admin-nav">
      <a href="dashboard.html">Rules &amp; Thoughts</a>
      <a href="editor.html" class="active">New Post</a>
      <a href="../index.html">View Website</a>
    </nav>
    <div>
      <p style="font-size:.78rem;color:rgba(244,233,201,.7);margin-bottom:.5rem;" id="admin-user-label"></p>
      <button class="btn btn--outline btn--sm btn--full" data-logout>Sign Out</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topline">
      <h1 id="editor-heading" style="margin:0;font-size:1.6rem;">New Post</h1>
      <a href="dashboard.html" class="btn btn--sm btn--outline-dark">&larr; Back to list</a>
    </div>

    <form class="admin-card" id="post-form">
      <div class="form-grid">
        <div class="field full">
          <label for="title">Title</label>
          <input id="title" required placeholder="e.g. Understanding Reverse Charge Under GST">
        </div>
        <div class="field">
          <label for="category">Category</label>
          <select id="category">
            <option value="rule">Rules</option>
            <option value="thought">Thoughts</option>
          </select>
        </div>
        <div class="field">
          <label for="status">Status</label>
          <select id="status">
            <option value="draft">Draft</option>
            <option value="published">Published</option>
          </select>
        </div>
        <div class="field full">
          <label for="cover_image">Cover Image URL</label>
          <input id="cover_image" placeholder="https://&hellip; (leave blank to auto-generate a placeholder)">
        </div>
        <div class="field full">
          <label for="excerpt">Excerpt (shown on listing cards)</label>
          <textarea id="excerpt" style="min-height:70px;" required></textarea>
        </div>
        <div class="field full">
          <label for="content">Full Content</label>
          <textarea id="content" style="min-height:280px;" required placeholder="Separate paragraphs with a blank line."></textarea>
        </div>
      </div>
      <div style="margin-top:1.5rem;display:flex;gap:1rem;">
        <button class="btn btn--gold" type="submit" id="save-btn">Save Post</button>
        <a href="dashboard.html" class="btn btn--outline-dark">Cancel</a>
      </div>
    </form>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="admin.js"></script>
</body>
</html>
